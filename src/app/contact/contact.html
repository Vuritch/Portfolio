<div *ngIf="alertMessage" class="alert alert-{{ alertType }} alert-dismissible fade show" role="alert">
  {{ alertMessage }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<section id="contact" class="contact">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">Let's work together on your next project</p>
    </div>
    <div class="contact-content">
      <div class="contact-info">
        <h3>Contact Information</h3>
        <div class="contact-item">
          <strong>Email:</strong>
          <a href="mailto:omarabderhman123@gmail.com">omarabderhman123@gmail.com</a>
        </div>
        <div class="contact-item">
          <strong>Phone:</strong>
          <a href="tel:+201027745122">+201027745122</a>
        </div>
        <div class="contact-item">
          <strong>Location:</strong>
          <span>Assiut , Egypt</span>
        </div>
        <div class="social-links">
          <a href="https://www.linkedin.com/in/omarabdelrahmanmostafa/" class="social-link" target="_blank" rel="noopener">
            LinkedIn
          </a>
          <a href="https://github.com/Vuritch" class="social-link" target="_blank" rel="noopener">
            GitHub
          </a>
          <a href="https://www.facebook.com/Omarabderhmanmostafa" class="social-link" target="_blank" rel="noopener">
            Facebook
          </a>
        </div>
      </div>
      <div class="contact-form">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="formData.name"
              required
              #name="ngModel"
              class="form-control"
            />
            <div *ngIf="name.invalid && name.touched" class="error-message">
              Name is required
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="formData.email"
              required
              email
              #email="ngModel"
              class="form-control"
            />
            <div *ngIf="email.invalid && email.touched" class="error-message">
              Please enter a valid email
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              [(ngModel)]="formData.subject"
              required
              #subject="ngModel"
              class="form-control"
            />
            <div *ngIf="subject.invalid && subject.touched" class="error-message">
              Subject is required
            </div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              [(ngModel)]="formData.message"
              required
              #message="ngModel"
              rows="5"
              class="form-control"
            ></textarea>
            <div *ngIf="message.invalid && message.touched" class="error-message">
              Message is required
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="contactForm.invalid || isSubmitting()"
          >
            {{ isSubmitting() ? 'Sending...' : 'Send Message' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
